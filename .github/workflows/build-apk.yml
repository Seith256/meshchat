import 'dart:math';
import 'package:flutter/foundation.dart';
import '../models/message.dart';
import '../models/user.dart';
import '../services/crypto_service.dart';
import '../services/db_service.dart';
import '../services/identity_service.dart';
import '../services/mesh_server.dart';
import '../services/peer_discovery.dart';
import '../services/relay_service.dart';
class MeshProvider extends ChangeNotifier {
  bool loading = true; String? myId; String? myName; int _myPort = 0;
  final RelayService _relay = RelayService(); MeshServer? _server; PeerDiscovery? _discovery;
  int get myPort => _myPort;
  Future<void> init() async {
    if (IdentityService.myPrivateKey == null) { final keys = await CryptoService.generateKeypair(); await IdentityService.saveKeys(keys.$1, keys.$2); }
    myId = IdentityService.myId; myName = IdentityService.myName; loading = false; notifyListeners();
    if (myId != null) await _bootNetwork();
  }
  Future<void> setup(String name) async { await IdentityService.create(name: name); myId = IdentityService.myId; myName = IdentityService.myName; notifyListeners(); await _bootNetwork(); }
  Future<void> _bootNetwork() async {
    _myPort = 40000 + Random().nextInt(10000);
    _server = MeshServer(port: _myPort, onEnvelope: (env) async { await _relay.handleEnvelope(env); notifyListeners(); });
    await _server!.start();
    _discovery = PeerDiscovery(myId: myId!, myName: myName!, myTcpPort: _myPort, onPeer: (p) async { _relay.updatePeer(p['id'], p['name'] ?? p['id'], p['ip'], p['port']); notifyListeners(); await _relay.sendHello(p['id']); });
    await _discovery!.start(); _relay.start();
  }
  List<MeshUser> get contacts => DbService.allUsers().where((u) => u.id != myId).toList();
  List<MeshMessage> messagesWith(String peer) => DbService.messagesWith(peer);
  List<MeshMessage> get relayQueue => DbService.relayQueue();
  Future<void> sendMessage(String to, String body) async {
    final msg = MeshMessage(id: 'MSG-${DateTime.now().millisecondsSinceEpoch}-${Random().nextInt(9999)}', from: myId!, to: to, body: body, createdAt: DateTime.now().millisecondsSinceEpoch);
    await _relay.sendMessage(msg, toId: to); notifyListeners();
  }
  @override
  void dispose() { _server?.stop(); _discovery?.stop(); _relay.stop(); super.dispose(); }
}

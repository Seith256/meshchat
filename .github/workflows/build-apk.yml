name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate project skeleton
        run: |
          flutter create --org com.meshchat --project-name meshchat tmp_project
          rm -rf tmp_project/lib
          mkdir -p tmp_project/lib/models tmp_project/lib/services tmp_project/lib/providers tmp_project/lib/screens

      - name: Auto-Generate Dart Files
        run: |
          cd tmp_project
          
          cat << 'EOF' > pubspec.yaml
name: meshchat
description: Offline mesh messaging
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  network_info_plus: ^5.0.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  cryptography: ^2.7.0
  crypto: ^3.0.3
  uuid: ^4.3.3
  provider: ^6.1.1
  intl: ^0.19.0
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
EOF


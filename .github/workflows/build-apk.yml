          cat << 'EOF' > lib/screens/mesh_map_screen.dart
import 'package:flutter/material.dart';
import 'package:provider/provider.dart';
import '../providers/mesh_provider.dart';
class MeshMapScreen extends StatelessWidget {
  const MeshMapScreen({super.key});
  @override
  Widget build(BuildContext context) {
    final mesh = context.watch<MeshProvider>();
    return Scaffold(appBar: AppBar(title: const Text('Mesh Network')), body: ListView(padding: const EdgeInsets.all(16), children: [
      Card(child: ListTile(leading: const Icon(Icons.hub), title: Text('You: ${mesh.myName}'), subtitle: Text('ID: ${mesh.myId} • Port: ${mesh.myPort}'))),
      const SizedBox(height: 12),
      Text('Peers (${mesh.contacts.length})', style: Theme.of(context).textTheme.titleMedium),
      ...mesh.contacts.map((p) => ListTile(leading: const Icon(Icons.circle, size: 10), title: Text(p.name), subtitle: Text(p.lastIp ?? 'unknown'))),
      const Divider(),
      Text('Relay queue (${mesh.relayQueue.length})', style: Theme.of(context).textTheme.titleMedium),
      ...mesh.relayQueue.map((m) => ListTile(leading: const Icon(Icons.outbox), title: Text('${m.from} -> ${m.to}'), subtitle: Text('ttl ${m.ttl} - ${m.status}'))),
    ]));
  }
}

import 'dart:async';
import '../models/message.dart';
import '../models/user.dart';
import 'crypto_service.dart';
import 'db_service.dart';
import 'identity_service.dart';
import 'mesh_client.dart';
class RelayService {
  final Map<String, Map<String, dynamic>> peers = {};
  final Set<String> _seenMessageIds = {};
  Timer? _tick;
  void start() => _tick = Timer.periodic(const Duration(seconds: 10), (_) => _flushRelayQueue());
  void stop() => _tick?.cancel();
  void updatePeer(String id, String name, String ip, int port) {
    peers[id] = {'id': id, 'name': name, 'ip': ip, 'port': port};
    DbService.saveUser(MeshUser(id: id, name: name, publicKey: DbService.getUser(id)?.publicKey, lastSeen: DateTime.now().millisecondsSinceEpoch, lastIp: ip, lastPort: port));
  }
  Future<void> handleEnvelope(Map<String, dynamic> env) async {
    final type = env['type']; final msgId = env['mid'] as String?;
    if (msgId != null) { if (_seenMessageIds.contains(msgId)) return; _seenMessageIds.add(msgId); }
    if (type == 'MSG') await _onMessage(env);
    else if (type == 'ACK') { final m = DbService.getMessage(env['mid']); if (m != null) { m.status = 'delivered'; await DbService.saveMessage(m); } await DbService.removeRelay(env['mid']); }
    else if (type == 'HELLO') { final u = DbService.getUser(env['id']); if (u != null) { u.publicKey = env['pub']; DbService.saveUser(u); } }
  }
  Future<void> _onMessage(Map<String, dynamic> env) async {
    final myId = IdentityService.myId!; final to = env['to']; final mid = env['mid']; final ttl = (env['ttl'] as int?) ?? 7;
    if (to == myId) {
      try {
        final plain = await CryptoService.decrypt(env['cipher'], IdentityService.myPrivateKey!);
        await DbService.saveMessage(MeshMessage(id: mid, from: env['from'], to: to, body: plain, createdAt: env['ts'], status: 'delivered'));
        final peer = peers[env['from']]; if (peer != null) await MeshClient.send(peer['ip'], peer['port'], {'type': 'ACK', 'mid': mid, 'from': myId});
      } catch (_) {} return;
    }
    if (ttl <= 1) return;
    final existing = DbService.getMessage(mid); if (existing != null && existing.status == 'delivered') return;
    final m = MeshMessage(id: mid, from: env['from'], to: to, body: '', ciphertext: env['cipher'], createdAt: env['ts'], ttl: ttl - 1);
    await DbService.saveMessage(m); await DbService.enqueueRelay(m); await _tryForward(m);
  }
  Future<void> sendMessage(MeshMessage msg, {required String toId}) async {
    msg.status = 'sent'; await DbService.saveMessage(msg);
    final user = DbService.getUser(toId);
    if (user?.publicKey == null) { msg.status = 'queued'; await DbService.saveMessage(msg); await DbService.enqueueRelay(msg); return; }
    final cipher = await CryptoService.encryptFor(msg.body, user!.publicKey!);
    final sent = await _flood({'type': 'MSG', 'mid': msg.id, 'from': msg.from, 'to': msg.to, 'cipher': cipher, 'ts': msg.createdAt, 'ttl': 7});
    if (!sent) { msg.status = 'queued'; await DbService.saveMessage(msg); await DbService.enqueueRelay(msg.copyWith(status: 'queued', ciphertext: cipher)); }
  }
  Future<void> _tryForward(MeshMessage m) async {
    if (m.ciphertext == null) return;
    if (await _flood({'type': 'MSG', 'mid': m.id, 'from': m.from, 'to': m.to, 'cipher': m.ciphertext, 'ts': m.createdAt, 'ttl': m.ttl})) await DbService.removeRelay(m.id);
  }
  Future<bool> _flood(Map<String, dynamic> env) async {
    var ok = false; final direct = peers[env['to']];
    if (direct != null && await MeshClient.send(direct['ip'], direct['port'], env)) return true;
    for (final p in peers.values) { if (p['id'] != env['from']) { if (await MeshClient.send(p['ip'], p['port'], env)) ok = true; } }
    return ok;
  }
  Future<void> _flushRelayQueue() async { for (final m in DbService.relayQueue()) { await _tryForward(m); } }
  Future<void> sendHello(String peerId) async {
    final p = peers[peerId]; if (p != null) await MeshClient.send(p['ip'], p['port'], {'type': 'HELLO', 'id': IdentityService.myId, 'name': IdentityService.myName, 'pub': IdentityService.myPublicKey});
  }
}

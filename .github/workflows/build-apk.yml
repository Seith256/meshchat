import 'dart:convert';
import 'dart:io';
class MeshClient {
  static Future<bool> send(String ip, int port, Map<String, dynamic> envelope) async {
    Socket? socket;
    try {
      socket = await Socket.connect(ip, port, timeout: const Duration(seconds: 3));
      final bytes = utf8.encode(jsonEncode(envelope));
      socket.add([(bytes.length >> 24) & 0xff, (bytes.length >> 16) & 0xff, (bytes.length >> 8) & 0xff, bytes.length & 0xff, ...bytes]);
      await socket.flush();
      return true;
    } catch (_) { return false; } finally { socket?.destroy(); }
  }
}

name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate project skeleton and overlay code
        run: |
          mkdir -p /tmp/custom
          cp -r lib /tmp/custom/lib
          cp pubspec.yaml /tmp/custom/pubspec.yaml
          
          flutter create --org com.meshchat --project-name meshchat tmp_project
          
          rm -rf tmp_project/lib
          cp -r /tmp/custom/lib tmp_project/lib
          cp /tmp/custom/pubspec.yaml tmp_project/pubspec.yaml

      - name: Inject Android permissions
        run: |
          cd tmp_project
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n</manifest>#' android/app/src/main/AndroidManifest.xml
          
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle || true

      - name: Get dependencies and Build APK
        run: |
          cd tmp_project
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meshchat-apks
          path: tmp_project/build/app/outputs/flutter-apk/*.apk

import 'dart:async';
import 'dart:convert';
import 'dart:io';
typedef MessageHandler = Future<void> Function(Map<String, dynamic>);
class MeshServer {
  final int port; final MessageHandler onEnvelope; ServerSocket? _server;
  MeshServer({required this.port, required this.onEnvelope});
  Future<void> start() async {
    _server = await ServerSocket.bind(InternetAddress.anyIPv4, port);
    _server!.listen((client) {
      final buf = <int>[];
      client.listen((data) => buf.addAll(data), onDone: () {
        try {
          if (buf.length < 4) return;
          final len = (buf[0] << 24) | (buf[1] << 16) | (buf[2] << 8) | buf[3];
          if (buf.length >= 4 + len) onEnvelope(jsonDecode(utf8.decode(buf.sublist(4, 4 + len))) as Map<String, dynamic>);
        } catch (_) {} finally { client.destroy(); }
      }, onError: (_) => client.destroy());
    });
  }
  void stop() => _server?.close();
}
